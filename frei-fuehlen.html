<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>frei fühlen — Praxis Gabriela Rätzo</title>
  <meta name="description" content="frei fühlen — Praxis von Gabriela Rätzo in Sattel. Thai-, LomiLomi- und SensualFlow-Massage, Buteyko-Atmung und Gesprächs-Begleitung." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="page-home.jsx"></script>
  <script type="text/babel" src="page-others.jsx"></script>

  <script type="text/babel" data-presets="react">
    function getRouteFromHash() {
      const h = (window.location.hash || '#home').replace(/^#\/?/, '');
      return h || 'home';
    }

    function App() {
      const [route, setRoute] = React.useState(getRouteFromHash());

      React.useEffect(() => {
        const onHash = () => {
          setRoute(getRouteFromHash());
          window.scrollTo({ top: 0, behavior: 'instant' });
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = (target) => {
        window.location.hash = '#' + target;
      };

      let page;
      if (route === 'home') page = <HomePage navigate={navigate} />;
      else if (route === 'angebote') page = <AngebotePage navigate={navigate} />;
      else if (route.startsWith('angebot/')) {
        const id = route.split('/')[1];
        page = <AngebotDetailPage id={id} navigate={navigate} />;
      }
      else if (route === 'ueber-mich') page = <UeberMichPage navigate={navigate} />;
      else if (route === 'frei-fuehlen') page = <FreiFuehlenPage navigate={navigate} />;
      else if (route === 'testimonials') page = <TestimonialsPage navigate={navigate} />;
      else if (route === 'empfehlungen') page = <EmpfehlungenPage navigate={navigate} />;
      else if (route === 'praxisraum') page = <PraxisraumPage navigate={navigate} />;
      else if (route === 'kontakt') page = <KontaktPage navigate={navigate} />;
      else page = <HomePage navigate={navigate} />;

      return (
        <>
          <Header route={route} navigate={navigate} />
          {page}
          <Footer navigate={navigate} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
